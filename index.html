<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stamp POS</title>
<meta name="description" content="Desktop point-of-sale tracker for stamps, backed by Google Sheets via Apps Script.">
<style>
  :root {
    --bg: #f3f4f6;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --border: #e2e6eb;
    --border-strong: #cfd5dc;
    --text: #141a21;
    --muted: #64707d;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #e8efff;
    --accent-text: #ffffff;
    --success: #15803d;
    --success-soft: #e7f6ec;
    --danger: #dc2626;
    --danger-soft: #fdecec;
    --warn: #b45309;
    --warn-soft: #fff4e0;
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 20px rgba(16,24,40,.06);
    --shadow-bar: 0 -6px 24px rgba(16,24,40,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1318; --surface: #171c23; --surface-2: #1d232b; --border: #2a323c; --border-strong: #3a444f;
      --text: #eef1f4; --muted: #97a3b0; --accent: #3b82f6; --accent-hover: #2f6fe0; --accent-soft: #1b2a45;
      --success: #34c26b; --success-soft: #16301f; --danger: #f26363; --danger-soft: #3a1c1c;
      --warn: #f2a33a; --warn-soft: #3a2a12;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); --shadow-bar: 0 -6px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1318; --surface: #171c23; --surface-2: #1d232b; --border: #2a323c; --border-strong: #3a444f;
    --text: #eef1f4; --muted: #97a3b0; --accent: #3b82f6; --accent-hover: #2f6fe0; --accent-soft: #1b2a45;
    --success: #34c26b; --success-soft: #16301f; --danger: #f26363; --danger-soft: #3a1c1c;
    --warn: #f2a33a; --warn-soft: #3a2a12;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); --shadow-bar: 0 -6px 24px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  input { font: inherit; color: inherit; }

  .app { max-width: 1240px; margin: 0 auto; padding: 28px 32px 150px; }

  /* Header */
  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
  .brand h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .brand p { margin: 4px 0 0; color: var(--muted); }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .status { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 13px; font-weight: 500; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.ok .dot { background: var(--success); }
  .status.err .dot { background: var(--danger); }
  .status.demo .dot { background: var(--warn); }
  .session { display: flex; gap: 18px; padding: 7px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; }
  .session span { color: var(--muted); }
  .session strong { font-weight: 600; margin-left: 5px; color: var(--text); }
  .btn-ghost { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 500; }
  .btn-ghost:hover:not(:disabled) { border-color: var(--border-strong); background: var(--surface-2); }
  .btn-ghost:disabled { opacity: .5; }

  .banner { display: none; align-items: center; gap: 10px; padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: 14px; }
  .banner.show { display: flex; }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.err { background: var(--danger-soft); color: var(--danger); }
  .banner code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }

  /* Cards */
  .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; margin-bottom: 30px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 16px;
    position: relative; transition: border-color .15s, opacity .15s;
  }
  .card.has-qty { border-color: var(--accent); }
  .card.out { opacity: .72; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .card-name { font-size: 18px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .card-price { font-size: 15px; color: var(--muted); margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .badge.out { background: var(--danger-soft); color: var(--danger); }
  .badge.low { background: var(--warn-soft); color: var(--warn); }
  .stock { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); }
  .stock .label { font-size: 13px; color: var(--muted); }
  .stock .num { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stock .num.zero { color: var(--danger); }
  .stock .num.low { color: var(--warn); }

  .qty { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; }
  .qty button {
    height: 48px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface);
    font-size: 22px; font-weight: 500; line-height: 1; transition: background .12s, border-color .12s;
  }
  .qty button:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .qty button:active:not(:disabled) { transform: translateY(1px); }
  .qty button:disabled { opacity: .4; }
  .qty input {
    height: 48px; text-align: center; font-size: 22px; font-weight: 600; border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong); background: var(--surface); width: 100%; font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .qty input::-webkit-outer-spin-button, .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qty input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .qty input:disabled { opacity: .5; background: var(--surface-2); }
  .line { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); min-height: 20px; }
  .line strong { color: var(--text); font-variant-numeric: tabular-nums; }

  /* Payment */
  .payment { display: flex; gap: 10px; margin-bottom: 30px; }
  .pay-btn {
    flex: 1; padding: 16px 18px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
    background: var(--surface); font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: border-color .12s, background .12s, color .12s;
  }
  .pay-btn svg { width: 20px; height: 20px; }
  .pay-btn:hover { border-color: var(--border-strong); }
  .pay-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

  /* Checkout bar */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); box-shadow: var(--shadow-bar); z-index: 10; }
  .bar-inner { max-width: 1240px; margin: 0 auto; padding: 18px 32px; display: flex; align-items: center; gap: 36px; }
  .bar-stat { display: flex; flex-direction: column; }
  .bar-stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .bar-stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar-stat .v.total { font-size: 30px; letter-spacing: -0.02em; }
  .bar-spacer { flex: 1; }
  .bar-pay { font-size: 14px; color: var(--muted); }
  .bar-pay strong { color: var(--text); }
  .btn-sell {
    min-width: 260px; height: 62px; padding: 0 30px; border-radius: 12px; border: 0;
    background: var(--accent); color: var(--accent-text); font-size: 18px; font-weight: 700; letter-spacing: -0.01em;
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    box-shadow: 0 6px 18px rgba(37,99,235,.28); transition: background .12s, transform .08s, box-shadow .12s;
  }
  .btn-sell:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-sell:active:not(:disabled) { transform: translateY(1px); }
  .btn-sell:disabled { opacity: .55; box-shadow: none; }
  .spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .8s linear infinite; display: none; }
  .btn-sell.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast { position: fixed; top: 22px; right: 22px; z-index: 20; display: flex; flex-direction: column; gap: 10px; }
  .toast-item {
    min-width: 280px; max-width: 420px; padding: 14px 16px; border-radius: var(--radius-sm); background: var(--surface);
    border: 1px solid var(--border); box-shadow: var(--shadow); font-size: 14px; display: flex; gap: 10px; align-items: flex-start;
    animation: pop .18s ease-out;
  }
  .toast-item.success { border-left: 4px solid var(--success); }
  .toast-item.error { border-left: 4px solid var(--danger); }
  .toast-item .t { font-weight: 600; }
  .toast-item .d { color: var(--muted); margin-top: 2px; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  @media (max-width: 900px) {
    .app { padding: 20px 16px 170px; }
    .grid { grid-template-columns: 1fr; }
    .header { flex-direction: column; }
    .bar-inner { flex-wrap: wrap; gap: 16px; padding: 14px 16px; }
    .btn-sell { width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <h1>Stamp POS</h1>
      <p>Cashier · stock synced with Google Sheets</p>
    </div>
    <div class="header-right">
      <div class="session" title="This browser session only">
        <div><span>Sales</span><strong id="sessionSales">0</strong></div>
        <div><span>Revenue</span><strong id="sessionRevenue">–</strong></div>
      </div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
      <button class="btn-ghost" id="refreshBtn" type="button">Refresh stock</button>
      <button class="btn-ghost" id="pinBtn" type="button" title="Cashier PIN (only needed if one is set in the Apps Script)">PIN</button>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <h2 class="section-title">Items</h2>
  <section class="grid" id="grid" aria-live="polite"></section>

  <h2 class="section-title">Payment method</h2>
  <div class="payment" role="radiogroup" aria-label="Payment method" id="payment">
    <button type="button" class="pay-btn" data-pay="Cash" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></svg>
      Cash
    </button>
    <button type="button" class="pay-btn" data-pay="Card" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
      Card
    </button>
    <button type="button" class="pay-btn" data-pay="Bank Transfer / QR" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v7h-7M17 21h.01"/></svg>
      Bank Transfer / QR
    </button>
  </div>
</div>

<div class="bar">
  <div class="bar-inner">
    <div class="bar-stat"><span class="k">Items</span><span class="v" id="barCount">0</span></div>
    <div class="bar-stat"><span class="k">Total</span><span class="v total" id="barTotal">–</span></div>
    <div class="bar-spacer"></div>
    <div class="bar-pay">Paying by <strong id="barPay">Cash</strong></div>
    <button class="btn-sell" id="sellBtn" type="button" disabled>
      <span class="spinner" aria-hidden="true"></span>
      <span id="sellLabel">Mark as Sold</span>
    </button>
  </div>
</div>

<div class="toast" id="toast" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ───────────────────────── CONFIG ─────────────────────────
  // Apps Script Web App URL (ends with /exec). Leave empty when deploying via
  // GitHub Actions — the Pages workflow injects it from APPS_SCRIPT_DEPLOYMENT_ID.
  const CONFIG = {
    SCRIPT_URL: '', // @inject SCRIPT_URL
    CURRENCY: 'USD',      // ISO 4217 code, e.g. 'EUR', 'CZK', 'GBP'
    LOCALE: 'en-US',      // number/currency formatting locale
    LOW_STOCK_AT: 5       // show a "Low stock" badge at or below this level
  };
  // ──────────────────────────────────────────────────────────

  const fmt = new Intl.NumberFormat(CONFIG.LOCALE, { style: 'currency', currency: CONFIG.CURRENCY });
  const money = n => fmt.format(Number(n) || 0);

  // Used only when SCRIPT_URL is empty so the UI can be previewed before deployment.
  const DEMO_ITEMS = [
    { name: 'Stamp A', price: 2.5, stock: 40 },
    { name: 'Stamp B', price: 4.0, stock: 12 },
    { name: 'Stamp C', price: 7.5, stock: 3 }
  ];

  const state = {
    items: [],                 // { name, price, stock, qty }
    payment: 'Cash',
    busy: false,
    demo: !CONFIG.SCRIPT_URL,
    session: { sales: 0, revenue: 0 }
  };

  const $ = id => document.getElementById(id);
  const els = {
    grid: $('grid'), status: $('status'), statusText: $('statusText'), banner: $('banner'),
    refreshBtn: $('refreshBtn'), payment: $('payment'), barCount: $('barCount'), barTotal: $('barTotal'),
    barPay: $('barPay'), sellBtn: $('sellBtn'), sellLabel: $('sellLabel'), toast: $('toast'),
    sessionSales: $('sessionSales'), sessionRevenue: $('sessionRevenue'), pinBtn: $('pinBtn')
  };
  let cardRefs = [];

  // Optional cashier PIN. Set POS_PIN in the Apps Script's Script Properties to require it;
  // the value is remembered in this browser only (localStorage), never committed anywhere.
  const PIN_KEY = 'stampPos.pin';
  function getPin() { try { return localStorage.getItem(PIN_KEY) || ''; } catch (e) { return ''; } }
  function askPin(message) {
    const v = window.prompt(message || 'Enter the cashier PIN:', '');
    if (v === null) return false;
    try { localStorage.setItem(PIN_KEY, v.trim()); } catch (e) {}
    renderPinBtn();
    return true;
  }
  function renderPinBtn() { els.pinBtn.textContent = getPin() ? 'PIN ✓' : 'PIN'; }

  // ───────────────────────── UI helpers ─────────────────────────
  function setStatus(kind, text) {
    els.status.className = 'status ' + kind;
    els.statusText.textContent = text;
  }
  function showBanner(kind, html) {
    els.banner.className = 'banner show ' + kind;
    els.banner.innerHTML = html;
  }
  function hideBanner() { els.banner.className = 'banner'; els.banner.innerHTML = ''; }

  function toast(kind, title, detail, ms) {
    const el = document.createElement('div');
    el.className = 'toast-item ' + kind;
    el.innerHTML = '<div><div class="t"></div><div class="d"></div></div>';
    el.querySelector('.t').textContent = title;
    el.querySelector('.d').textContent = detail || '';
    els.toast.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .25s';
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 260);
    }, ms || 3500);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ───────────────────────── Rendering ─────────────────────────
  function buildCards() {
    els.grid.innerHTML = '';
    cardRefs = state.items.map((item, i) => {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML =
        '<div class="card-top">' +
          '<div><h3 class="card-name"></h3><div class="card-price"></div></div>' +
          '<span class="badge" hidden></span>' +
        '</div>' +
        '<div class="stock"><span class="label">In stock</span><span class="num">0</span></div>' +
        '<div class="qty">' +
          '<button type="button" class="dec" aria-label="Decrease quantity">−</button>' +
          '<input type="number" inputmode="numeric" min="0" step="1" value="0" aria-label="Quantity">' +
          '<button type="button" class="inc" aria-label="Increase quantity">+</button>' +
        '</div>' +
        '<div class="line"><span>Subtotal</span><strong class="sub"></strong></div>';
      const r = {
        card,
        name: card.querySelector('.card-name'),
        price: card.querySelector('.card-price'),
        badge: card.querySelector('.badge'),
        num: card.querySelector('.num'),
        dec: card.querySelector('.dec'),
        inc: card.querySelector('.inc'),
        input: card.querySelector('input'),
        sub: card.querySelector('.sub')
      };
      r.dec.addEventListener('click', () => setQty(i, state.items[i].qty - 1));
      r.inc.addEventListener('click', () => setQty(i, state.items[i].qty + 1));
      r.input.addEventListener('input', () => setQty(i, parseInt(r.input.value, 10), true));
      r.input.addEventListener('blur', () => { r.input.value = state.items[i].qty; });
      r.input.addEventListener('focus', () => r.input.select());
      els.grid.appendChild(card);
      return r;
    });
    renderAll();
  }

  function renderCard(i) {
    const item = state.items[i], r = cardRefs[i];
    const out = item.stock <= 0;
    const low = !out && item.stock <= CONFIG.LOW_STOCK_AT;
    r.name.textContent = item.name;
    r.price.textContent = money(item.price) + ' each';
    r.num.textContent = item.stock;
    r.num.className = 'num' + (out ? ' zero' : low ? ' low' : '');
    r.badge.hidden = !(out || low);
    r.badge.className = 'badge ' + (out ? 'out' : 'low');
    r.badge.textContent = out ? 'Out of stock' : 'Low stock';
    r.card.className = 'card' + (out ? ' out' : '') + (item.qty > 0 ? ' has-qty' : '');
    const disabled = out || state.busy;
    r.input.disabled = disabled;
    r.input.max = item.stock;
    if (document.activeElement !== r.input) r.input.value = item.qty;
    r.dec.disabled = disabled || item.qty <= 0;
    r.inc.disabled = disabled || item.qty >= item.stock;
    r.sub.textContent = item.qty > 0 ? money(item.qty * item.price) : '—';
  }

  function totals() {
    return state.items.reduce((acc, it) => {
      acc.count += it.qty; acc.total += it.qty * it.price; return acc;
    }, { count: 0, total: 0 });
  }

  function renderBar() {
    const t = totals();
    els.barCount.textContent = t.count;
    els.barTotal.textContent = t.count ? money(t.total) : '–';
    els.barPay.textContent = state.payment;
    els.sellBtn.disabled = state.busy || t.count === 0;
    els.sellBtn.classList.toggle('loading', state.busy);
    els.sellLabel.textContent = state.busy ? 'Saving sale…' : 'Mark as Sold';
    els.refreshBtn.disabled = state.busy;
    els.sessionSales.textContent = state.session.sales;
    els.sessionRevenue.textContent = state.session.sales ? money(state.session.revenue) : '–';
  }

  function renderAll() {
    state.items.forEach((_, i) => renderCard(i));
    renderBar();
  }

  // ───────────────────────── Quantity logic ─────────────────────────
  function setQty(i, value, fromTyping) {
    const item = state.items[i];
    if (state.busy || item.stock <= 0) return;
    let q = Number.isFinite(value) ? Math.floor(value) : 0;
    if (q < 0) q = 0;
    if (q > item.stock) {
      q = item.stock;                       // hard cap at available stock
      if (fromTyping) toast('error', 'Only ' + item.stock + ' available', item.name + ' quantity capped at current stock.', 2200);
    }
    item.qty = q;
    renderCard(i);
    renderBar();
    if (fromTyping) cardRefs[i].input.value = q;
  }

  els.payment.addEventListener('click', e => {
    const btn = e.target.closest('.pay-btn');
    if (!btn || state.busy) return;
    state.payment = btn.dataset.pay;
    els.payment.querySelectorAll('.pay-btn').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
    renderBar();
  });

  // ───────────────────────── Backend ─────────────────────────
  function apiGet() {
    const url = CONFIG.SCRIPT_URL + (CONFIG.SCRIPT_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
    return fetch(url, { method: 'GET', redirect: 'follow', cache: 'no-store' }).then(r => r.json());
  }
  function apiPost(payload) {
    // text/plain keeps this a "simple" CORS request: Apps Script cannot answer a preflight (OPTIONS).
    return fetch(CONFIG.SCRIPT_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(r => r.json());
  }

  function normalizeItems(list) {
    return (list || []).slice(0, 3).map(it => ({
      name: String(it.name || 'Unnamed'),
      price: Number(it.price) || 0,
      stock: Math.max(0, Math.floor(Number(it.stock) || 0)),
      qty: 0
    }));
  }

  async function loadInventory() {
    if (state.demo) {
      state.items = normalizeItems(DEMO_ITEMS);
      setStatus('demo', 'Demo mode');
      showBanner('warn', '<strong>Not connected.</strong>&nbsp;Set <code>CONFIG.SCRIPT_URL</code> in index.html to your Apps Script Web App URL. Sales made now are not saved.');
      buildCards();
      return;
    }
    setStatus('', 'Loading stock…');
    els.refreshBtn.disabled = true;
    try {
      const data = await apiGet();
      if (!data || data.ok !== true) throw new Error((data && data.error) || 'Unexpected response');
      const items = normalizeItems(data.items);
      if (items.length !== 3) throw new Error('Expected 3 items in the Inventory tab, got ' + items.length);
      state.items = items;
      hideBanner();
      setStatus('ok', 'Connected · updated ' + new Date().toLocaleTimeString());
      buildCards();
    } catch (err) {
      setStatus('err', 'Connection failed');
      showBanner('err', '<strong>Could not load inventory.</strong>&nbsp;' + escapeHtml(err.message || String(err)) + ' — check the Web App URL and that it is deployed for “Anyone”.');
    } finally {
      els.refreshBtn.disabled = state.busy;
    }
  }

  async function markAsSold() {
    if (state.busy) return;
    const t = totals();
    if (t.count === 0) return;

    const quantities = state.items.map(it => it.qty);
    const snapshot = state.items.map(it => ({ stock: it.stock, qty: it.qty }));
    const payload = {
      quantities,
      paymentMethod: state.payment,
      total: Number(t.total.toFixed(2)),
      clientTime: new Date().toISOString(),
      pin: getPin()
    };

    // Optimistic: deduct immediately, reset selectors, lock the UI while the request is in flight.
    state.items.forEach((it, i) => { it.stock -= quantities[i]; it.qty = 0; });
    state.busy = true;
    renderAll();

    try {
      let data;
      if (state.demo) {
        await new Promise(r => setTimeout(r, 650));
        data = { ok: true, items: state.items.map(it => ({ name: it.name, price: it.price, stock: it.stock })), sale: { total: payload.total } };
      } else {
        data = await apiPost(payload);
      }
      if (!data || data.ok !== true) throw new Error((data && data.error) || 'Server rejected the sale');

      // Sync with the authoritative stock from the sheet (handles concurrent cashiers).
      if (Array.isArray(data.items) && data.items.length === 3) {
        data.items.forEach((srv, i) => {
          state.items[i].stock = Math.max(0, Math.floor(Number(srv.stock) || 0));
          if (srv.price != null) state.items[i].price = Number(srv.price) || state.items[i].price;
        });
      }
      const saleTotal = (data.sale && Number(data.sale.total)) || t.total;
      state.session.sales += 1;
      state.session.revenue += saleTotal;
      toast('success', 'Sale recorded · ' + money(saleTotal),
        t.count + ' item' + (t.count === 1 ? '' : 's') + ' · ' + state.payment + (state.demo ? ' (demo, not saved)' : ''));
    } catch (err) {
      // Roll back the optimistic deduction so the cashier can retry.
      state.items.forEach((it, i) => { it.stock = snapshot[i].stock; it.qty = snapshot[i].qty; });
      const msg = err.message || String(err);
      toast('error', 'Sale not saved', msg + ' — stock restored, please try again.', 6000);
      if (/\bPIN\b/i.test(msg)) setTimeout(() => askPin(msg + '\n\nEnter the cashier PIN:'), 50);
    } finally {
      state.busy = false;
      renderAll();
    }
  }

  els.sellBtn.addEventListener('click', markAsSold);
  els.refreshBtn.addEventListener('click', loadInventory);
  els.pinBtn.addEventListener('click', () => askPin());
  renderPinBtn();
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); markAsSold(); }
  });

  loadInventory();
})();
</script>
</body>
</html>
